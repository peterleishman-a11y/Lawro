name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # package.json declares engines >=20, so prove both ends of that claim.
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci, not install: fails loudly if package-lock.json has drifted.
      - run: npm ci

      - run: npm test

      # The tests use a temp database; this checks the real startup path —
      # schema creation on a fresh disk, then a health probe that reads a row.
      - name: Boot and probe /api/health
        run: |
          DATABASE_PATH="${RUNNER_TEMP}/lawro.db" PORT=3000 node src/server.js &
          for i in $(seq 1 20); do
            if curl -sf --max-time 2 http://localhost:3000/api/health > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 20s"; exit 1
